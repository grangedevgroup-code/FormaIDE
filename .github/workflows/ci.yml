name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ninja
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset headless
      - run: cmake --build --preset headless --parallel
      - run: ctest --test-dir build/headless --output-on-failure --timeout 300

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ninja py7zr
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev fonts-dejavu-core
      - name: Fetch Qt
        shell: bash
        run: |
          python scripts/fetch_qt.py "$RUNNER_TEMP/qt" | tee fetch.log
          prefix=$(tail -n 1 fetch.log)
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - run: cmake --preset dev
      - run: cmake --build --preset dev --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/dev --output-on-failure --timeout 900
      - name: Build a generated Qt project
        run: python tests/toolchain/run_generators.py build/dev/bin/forma "${{ runner.temp }}/generated" qt-desktop

  generated-projects:
    name: Generated projects (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            templates: web-static web-react windows-wpf python-tk python-qt android-compose python-script node-script go-cli rust-cli cpp-library
          - os: ubuntu-24.04
            templates: web-static web-react python-tk python-qt android-compose python-script node-script go-cli rust-cli cpp-library
          - os: macos-26
            templates: web-static web-react python-tk python-qt apple-swiftui python-script node-script go-cli rust-cli cpp-library
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - if: runner.os != 'macOS'
        name: Android platform
        shell: bash
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager$([ "$RUNNER_OS" = Windows ] && echo .bat)" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - run: pip install ninja PySide6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset headless
      - run: cmake --build --preset headless --parallel --target forma
      - name: Build generated projects
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/toolchain/run_generators.py build/headless/bin/forma "${{ runner.temp }}/generated" ${{ matrix.templates }}

  web-core:
    name: Core compiled to WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ninja
      - uses: mymindstorm/setup-emsdk@v14
      - run: emcmake cmake --preset web-core
      - run: cmake --build --preset web-core --parallel
