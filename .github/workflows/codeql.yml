name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - run: pip install ninja
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - run: cmake --preset headless -DFORMA_BUILD_TESTS=OFF
      - run: cmake --build --preset headless --parallel
      - uses: github/codeql-action/analyze@v4
